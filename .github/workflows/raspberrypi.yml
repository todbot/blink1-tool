name: raspberrypi

#on: [push, pull_request, workflow_dispatch]
on:
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Upload installers to the latest GitHub release'
        type: boolean
        default: false

env:
  HIDAPI_VERSION: "0.15.0"

jobs:
  build:
    permissions:
      contents: write  # for 'gh release upload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: blink1-tool
      - name: Get git tags
        # Makefile reads .git-tag if present; no git tag lookup needed in the arm chroot
        run: |
          cd blink1-tool
          git fetch --tags
          git tag --sort=v:refname | tail -1 > .git-tag
      - uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite_arm64:latest
          cpu: cortex-a53
          #base_image: raspios_lite:latest
          #cpu: cortex-a7
          copy_artifact_path: artifacts
          commands: |
            apt-get update
            apt-get install -y build-essential git pkg-config libudev-dev libusb-1.0-0-dev
            cd blink1-tool
            make
            make blink1-tiny-server
            make package
            make package-tiny-server
            mkdir -p ../artifacts
            cp *.zip ../artifacts/
            ls -la ../artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: blink1-tool-raspberrypi
          path: artifacts/*.zip

      - name: Attach zips to latest GitHub release
        if: inputs.upload_to_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # checkout is in a subdir, so no repo in cwd
        run: gh release upload "$(gh release view --json tagName -q .tagName)" artifacts/*.zip --clobber

